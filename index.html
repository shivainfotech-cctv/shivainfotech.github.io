<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shiva Infotech | CCTV & IT Solutions</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
scroll-behavior:smooth;
}

body{
font-family:'Poppins',sans-serif;
background:#06111f;
color:white;
overflow-x:hidden;
}

/* Animated Background */
body::before{
content:'';
position:fixed;
width:600px;
height:600px;
background:radial-gradient(circle,#00c6ff33,transparent 70%);
top:-200px;
left:-150px;
z-index:-1;
animation:moveGlow 8s linear infinite alternate;
}

body::after{
content:'';
position:fixed;
width:500px;
height:500px;
background:radial-gradient(circle,#0072ff22,transparent 70%);
bottom:-150px;
right:-100px;
z-index:-1;
animation:moveGlow2 10s linear infinite alternate;
}

@keyframes moveGlow{
0%{transform:translate(0,0);}
100%{transform:translate(100px,80px);}
}

@keyframes moveGlow2{
0%{transform:translate(0,0);}
100%{transform:translate(-80px,-60px);}
}

/* HEADER */

header{
position:fixed;
width:100%;
top:0;
left:0;
padding:18px 60px;
display:flex;
justify-content:space-between;
align-items:center;
</html>
